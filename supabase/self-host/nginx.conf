# Gateway that presents GoTrue / PostgREST / Storage / Realtime under the
# single base URL supabase-js expects (auth/v1, rest/v1, storage/v1,
# realtime/v1). Stands in for Kong from the official self-host compose —
# including CORS, which Kong normally injects (the services themselves
# don't reliably send Access-Control-Allow-Origin, and without it the
# browser fails every request with "Failed to fetch").

# Reflect whatever request headers the browser asks for in the preflight.
map $http_access_control_request_headers $cors_allow_headers {
    default $http_access_control_request_headers;
    ''      'Authorization, Content-Type, apikey, X-Client-Info, X-Supabase-Api-Version';
}

server {
    listen 8000;
    client_max_body_size 50m;

    # Docker's embedded DNS; with variable upstreams nginx re-resolves
    # instead of pinning container IPs at startup (a restarted service
    # would otherwise 502 until the gateway restarts too).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream auth:9999;
    set $rest_upstream rest:3000;
    set $storage_upstream storage:5000;
    set $realtime_upstream realtime-dev.supabase-realtime:4000;

    # CORS for every response; upstream copies are hidden so the browser
    # never sees duplicate (and therefore invalid) header values.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers 'Content-Range, X-Supabase-Api-Version' always;
    add_header Vary Origin always;

    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"wacrm-supabase-gateway"}';
    }

    location ~ ^/auth/v1/(.*)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://$auth_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/rest/v1/(.*)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://$rest_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/storage/v1/(.*)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://$storage_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ~ ^/realtime/v1/(.*)$ {
        rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
        proxy_pass http://$realtime_upstream;
        # Tenant lookup keys off the first Host label ("realtime-dev").
        proxy_set_header Host realtime-dev.supabase-realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
