# Self-hosted Supabase service layer for WA-CRM, pointed at an EXTERNAL
# stock Postgres (no bundled database). The app talks to the gateway on
# :${GATEWAY_PORT} exactly as it would talk to a hosted Supabase project.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#
# Prerequisite: supabase/postgres-compat/010_service_roles.sql has been
# applied to the target database.

name: wacrm-supabase

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${GATEWAY_PORT:-8000}:8000'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - rest
      - storage
      - realtime
    restart: unless-stopped

  auth:
    image: supabase/gotrue:${GOTRUE_TAG:-v2.177.0}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SVC_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?search_path=auth

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: 'false'

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated

      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # No SMTP configured: confirm signups immediately. Wire GOTRUE_SMTP_*
      # and set this to false when you have a mail server.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMS_AUTOCONFIRM: 'true'
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:${POSTGREST_TAG:-v12.2.12}
    environment:
      PGRST_DB_URI: postgres://authenticator:${SVC_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    restart: unless-stopped

  storage:
    image: supabase/storage-api:${STORAGE_TAG:-v1.25.7}
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000

      DATABASE_URL: postgres://supabase_storage_admin:${SVC_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_INSTALL_ROLES: 'false'

      TENANT_ID: wacrm
      REGION: local
      GLOBAL_S3_BUCKET: unused
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 52428800
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage
    restart: unless-stopped

  realtime:
    image: supabase/realtime:${REALTIME_TAG:-v2.34.47}
    networks:
      default:
        # Realtime resolves its tenant from the first label of the Host
        # header; the gateway forwards requests with this exact host.
        aliases:
          - realtime-dev.supabase-realtime
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${SVC_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
    restart: unless-stopped

volumes:
  storage-data:
