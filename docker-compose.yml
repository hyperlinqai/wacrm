name: wacrm

services:
  app:
    build:
      context: .
    # Runtime secrets. Later files override earlier ones. A production
    # host typically has only .env.production; local docker still
    # prefers .env.local when both exist.
    env_file:
      - path: .env.production
        required: false
      - path: .env.local
        required: false
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
      # Uploaded media (avatars, chat/flow media) lives on this volume.
      STORAGE_DIR: /var/lib/wacrm-storage
    volumes:
      - storage-data:/var/lib/wacrm-storage
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  storage-data:
